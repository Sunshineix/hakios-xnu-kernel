#        hello 鐢ㄦ埛鎬佽緭鍑?name: qemu-open (XNU boots in QEMU)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: qemu-open-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qemu-open:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld flex bison m4 autoconf automake libtool \
            perl python3 python3-pip git curl tar xz-utils unzip zip fakeroot \
            qemu-system-aarch64 qemu-efi-aarch64

      - name: Install theos with its Linux toolchain and the iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks-git"
          git -C "$HOME/theos/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          ln -s ../sdks-git/iPhoneOS16.5.sdk "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Doctor (what this machine has and lacks)
        run: make doctor || true

      - name: Build and boot the open kernel in QEMU
        run: |
          mkdir -p logs
          make qemu-open SECS=120 | tee logs/qemu-open.log

      - name: Check the serial log for the boot markers
        run: |
          grep -E '== XNULOADER v3 ==' logs/qemu-open.log
          grep -E 'hakios-kernel: .* drivers built in' logs/qemu-open.log

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-open-log
          path: logs/qemu-open.log
          retention-days: 7

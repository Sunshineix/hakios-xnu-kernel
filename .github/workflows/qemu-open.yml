# X9U-iOS移植项目 M1a：hakios 开源内核在 QEMU 中启动验证
# 无任何 Apple 私有二进制：XNU 内核（Apple 开源树 + hakios 补丁）+ 占位引导器 + hello 内存盘
#
# 用法：
#   1. 在你的 GitHub 账号上 fork 仓库 oosexgang/hakios-xnu-kernel
#   2. 在 fork 的网页上：Add file → Create new file
#      文件名填 .github/workflows/qemu-open.yml，把本文件内容粘贴进去，Commit
#   3. Actions 标签页 → 左侧 "qemu-open (XNU boots in QEMU)" → Run workflow
#   4. 首次构建约 30-60 分钟（下载 Apple xnu 源码树并编译内核）
#   5. 成功标志（构建日志 / 上传的 qemu-open-log 工件里）：
#        == XNULOADER v3 ==
#        hakios-kernel: version ... / hakios-kernel: N drivers built in (...)
#        hello 用户态输出
name: qemu-open (XNU boots in QEMU)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: qemu-open-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qemu-open:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld flex bison m4 autoconf automake libtool \
            perl python3 python3-pip git curl tar xz-utils unzip zip fakeroot uuid-dev \
            qemu-system-aarch64 qemu-efi-aarch64 ipxe-qemu

      - name: Install theos with its Linux toolchain and the iPhoneOS 16.5 SDK
        run: |
          export THEOS="$HOME/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$THEOS/sdks-git"
          git -C "$THEOS/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          ln -sfn ../sdks-git/iPhoneOS16.5.sdk "$THEOS/sdks/iPhoneOS16.5.sdk"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -5

      - name: Doctor (what this machine has and lacks)
        run: make doctor || true

      - name: Build and boot the open kernel in QEMU
        run: |
          set -o pipefail
          mkdir -p logs
          if ! make qemu-open SECS=120 BUILD_DSYM=0 2>&1 | tee logs/qemu-open.log; then
            echo '=== xnu-deps/exporthdrs.log ==='
            cat xnu-deps/exporthdrs.log 2>/dev/null || true
            echo '=== xnu-deps/setup logs ==='
            ls xnu-deps/*.log 2>/dev/null | while read -r f; do echo "--- $f ---"; tail -30 "$f"; done || true
            exit 1
          fi

      - name: Check the serial log for the boot markers
        run: |
          grep -E '== XNULOADER v3 ==' logs/qemu-open.log
          grep -E 'hakios-kernel: .* drivers built in' logs/qemu-open.log

      - name: Upload the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-open-log
          path: logs/qemu-open.log
          retention-days: 7

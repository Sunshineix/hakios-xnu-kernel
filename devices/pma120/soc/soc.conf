# socs/sm8850/soc.conf: what this SoC repository is: the facts of the Qualcomm SM8850 chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8850.config from its defconfig. docs/porting/repositories.md has every word.

soc sm8850
	title       Qualcomm SM8850-AC (Snapdragon 8 Elite Gen 5; "canoe", "kaanapali")
	vendor      Qualcomm
	cores       8: 6x Oryon M 3.63 GHz (cpus 0-5), 2x Oryon L 4.61 GHz (cpus 6-7); the biggest is core 7
	gpu         Adreno 840
	maintainer  X9U-iOS 移植项目 (README.md)

# devices/pma120/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/pma120.md) is made from it, so that the status is said in one place.

device pma120
	title       OPPO Find X9 Ultra
	vendor      OPPO
	soc         sm8850
	defconfig   pma120_defconfig
	maintainer  X9U-iOS 移植项目 (README.md)
	status      display     missing   X9 Ultra 面板（经 UEFI framebuffer；未开始）
	status      touch       missing   未开始（触控 IC 待从 dtb/内核确认）
	status      buttons     missing   未开始（电源/音量经 PMIC）
	status      cpu         partial   8 核已确认：6× Oryon M（cpu0-5）+ 2× Oryon L（cpu6-7，4.61GHz）；soc_* 参数 15/16 已定位
	status      gpu         missing   Adreno 840（hakios-metal 目前只有 642L 表；需新建 a8xx 表 + 固件）
	status      storage     missing   UFS；未开始
	status      audio       missing   未开始
	status      battery     missing   未开始
	status      haptic      missing   未开始
	status      camera      missing   未开始
	status      wifi        missing   未开始
	status      bluetooth   missing   未开始
	status      cellular    missing   IPA v5.5（主线在建）；soc_* 地址已备
	status      thermal     missing   未开始
